backend:
  name: github
  repo: micho9879/demo-strony
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "courses"
    label: "Kursy UDT (Baza Pytań)"
    description: "Zarządzaj pytaniami testowymi dla poszczególnych kursów"
    files:
      - label: "Podesty Ruchome"
        name: "podesty"
        file: "data/podesty.json"
        fields:
          - label: "Pytania Główne (UDT)"
            name: "questions"
            widget: "list"
            fields:
              - {label: "ID pytania", name: "id", widget: "number"}
              - {label: "Treść pytania", name: "question", widget: "string"}
              - {label: "Zdjęcie (opcjonalnie, np. nazwa_pliku.jpg)", name: "image", widget: "string", required: false}
              - label: "Opcje odpowiedzi"
                name: "options"
                widget: "list"
                field: {label: "Opcja", name: "option", widget: "string"}
              - {label: "Poprawna odpowiedź (1, 2, 3 lub 4)", name: "correct", widget: "number"}
          - label: "Inne Pytania (Dodatkowa zakładka)"
            name: "other_questions"
            widget: "list"
            required: false
            fields:
              - {label: "ID pytania", name: "id", widget: "number"}
              - {label: "Treść pytania", name: "question", widget: "string"}
              - {label: "Zdjęcie (opcjonalnie, np. nazwa_pliku.jpg)", name: "image", widget: "string", required: false}
              - label: "Opcje odpowiedzi"
                name: "options"
