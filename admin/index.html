<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sveltia CMS</title>
    <!-- Link to config.yml -->
    <link href="config.yml" type="application/yaml" rel="cms-config-url" />
    <style>
      /* Podświetlenie znalezionego pytania po skoku */
      .cms-jump-highlight {
        outline: 3px solid #F5B84F !important;
        outline-offset: 3px !important;
        border-radius: 8px !important;
        box-shadow: 0 0 22px rgba(245, 184, 79, 0.45) !important;
        transition: outline 0.2s ease, box-shadow 0.2s ease !important;
      }
      .cms-inline-jump {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 12px;
        font-family: inherit;
        vertical-align: middle;
      }
      .cms-inline-jump-lbl {
        font-size: 12px;
        font-weight: 600;
        color: var(--sui-secondary-foreground-color, #a0aec0);
        white-space: nowrap;
      }
      .cms-inline-jump-inp {
        width: 60px;
        height: 26px;
        padding: 0 6px;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #101218;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      .cms-inline-jump-inp:focus {
        border-color: #F5B84F;
        box-shadow: 0 0 0 1px #F5B84F;
      }
      .cms-inline-jump-btn {
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 700;
        border-radius: 6px;
        border: none;
        background: #F5B84F;
        color: #101218;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        transition: background 0.15s ease;
      }
      .cms-inline-jump-btn:hover {
        background: #f7c56e;
      }
    </style>
  </head>
  <body>
    <!-- Wczytanie Sveltia CMS -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- Skrypt skoku bezpośrednio w pasku pytań egzaminacyjnych -->
    <script>
      (function () {
        function attachJumpControls() {
          // Szukamy pasków narzędziowych list (toolbar top)
          var toolbars = document.querySelectorAll('[class*="toolbar"][class*="top"], .toolbar.top');
          toolbars.forEach(function (toolbar) {
            if (toolbar.querySelector('.cms-inline-jump')) return;

            // Sprawdzamy czy pasek należy do pytań (Pytania UDT, Pytania BHP, lub zakładka exam)
            var text = (toolbar.textContent || '');
            var isExam = window.location.hash.indexOf('/entries/exam') !== -1;
            var isQuestions = /pytani|pytań/i.test(text);
            var isLargeList = /\b\d{2,}\b/.test(text); // np. "239 Pytania"

            if (!isExam && !isQuestions && !isLargeList) return;

            // Tworzymy kontrolkę skoku
            var box = document.createElement('div');
            box.className = 'cms-inline-jump';
            box.title = 'Wpisz numer pytania i wciśnij Enter';
            box.innerHTML =
              '<span class="cms-inline-jump-lbl">Idź do:</span>' +
              '<input type="number" class="cms-inline-jump-inp" min="1" placeholder="Nr" />' +
              '<button type="button" class="cms-inline-jump-btn">Skocz</button>';

            // Umieszczamy kontrolkę obok przycisków "Rozwiń wszystko / Zwiń wszystko"
            var actions = toolbar.querySelector('[class*="actions"], .actions');
            if (actions) {
              actions.appendChild(box);
            } else {
              toolbar.appendChild(box);
            }

            var inp = box.querySelector('.cms-inline-jump-inp');
            var btn = box.querySelector('.cms-inline-jump-btn');

            function doJump() {
              var val = parseInt(inp.value, 10);
              if (isNaN(val) || val < 1) return;

              // Kontener nadrzędny listy
              var widget = toolbar.closest('section, fieldset, [data-widget="list"]') || toolbar.parentElement;
              if (!widget) return;

              // Pobieramy wyłącznie elementy nadrzędne listy (pomijamy zagnieżdżone opcje odpowiedzi)
              var allGroups = Array.from(widget.querySelectorAll('[role="group"], [class*="item"]'));
              var topItems = allGroups.filter(function (el) {
                if (!el.parentElement) return true;
                return !el.parentElement.closest('[role="group"], [class*="item"]');
              });

              if (!topItems.length) return;

              // 1. Szukamy pytania, którego pole "ID pytania" ma wpisaną wartość val
              var target = null;
              for (var i = 0; i < topItems.length; i++) {
                var it = topItems[i];
                var inputs = it.querySelectorAll('input');
                for (var j = 0; j < inputs.length; j++) {
                  if (parseInt(inputs[j].value, 10) === val) {
                    target = it;
                    break;
                  }
                }
                if (target) break;

                // Sprawdzamy czy nagłówek pozycji zawiera ten numer (np. "1", "250")
                var headerBtn = it.querySelector('button, [role="button"]');
                if (headerBtn) {
                  var hText = (headerBtn.textContent || '').trim();
                  var match = hText.match(/^#?(\d+)\b/);
                  if (match && parseInt(match[1], 10) === val) {
                    target = it;
                    break;
                  }
                }
              }

              // 2. Jeśli nie znaleziono po polu ID, bierzemy pozycję z listy (1-based)
              if (!target) {
                var idx = Math.max(0, Math.min(val - 1, topItems.length - 1));
                target = topItems[idx];
              }

              if (target) {
                // Jeśli pozycja jest zwinięta, rozwijamy ją
                var toggle = target.querySelector('button[aria-expanded="false"]');
                if (toggle) {
                  toggle.click();
                }

                // Płynne przewinięcie na środek ekranu
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });

                // Efektowne podświetlenie
                target.classList.add('cms-jump-highlight');
                setTimeout(function () {
                  target.classList.remove('cms-jump-highlight');
                }, 2500);

                // Ustawienie kursora w polu pytania
                var targetInp = target.querySelector('input[type="text"], textarea, input');
                if (targetInp) {
                  setTimeout(function () { targetInp.focus(); }, 350);
                }
              }
            }

            inp.addEventListener('keydown', function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                doJump();
              }
            });
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              doJump();
            });
            inp.addEventListener('focus', function () { inp.select(); });
          });
        }

        // Obserwacja dynamicznego renderowania widoków przez Sveltia CMS
        var observer = new MutationObserver(attachJumpControls);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('hashchange', function () {
          setTimeout(attachJumpControls, 300);
        });
        setInterval(attachJumpControls, 1000);
      })();
    </script>
  </body>
</html>
